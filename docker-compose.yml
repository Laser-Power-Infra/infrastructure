  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"

    volumes:
      - ./redis-data:/data

    networks:
      - infra

  volume-init:
    image: alpine
    command: ["sh", "-c", "echo 'CIFS volumes initialized'"]
    volumes:
      - condutor:/mnt/condutor
      - indexer:/mnt/indexer
      - supply:/mnt/supply
      - costing:/mnt/costing
      - old-files:/mnt/old-files

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped

    ports:
      - "9001:6333"

    volumes:
      - ./qdrant-data:/qdrant/storage

    networks:
      - infra

  minio:
    image: quay.io/minio/minio:latest
    container_name: minio
    restart: unless-stopped

    ports:
      - "8500:9000"
      - "8501:9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    command: server /data --console-address ":9001"

    volumes:
      - minio-data:/data

    networks:
      - infra

  postgres-backup:
    build:
      context: ./ofelia
    container_name: postgres-backup
    # One-shot; started on schedule by ofelia
    restart: "no"

    env_file:
      - .env

    environment:
      POSTGRES_HOST: postgres
      TZ: Asia/Kolkata

    volumes:
      - ./postgres-backups:/backups/postgres
      - database:/network-backups

    depends_on:
      - postgres

    networks:
      - infra

  ofelia:
    image: mcuadros/ofelia:latest
    container_name: ofelia
    restart: unless-stopped
    command: daemon --config=/etc/ofelia/config.ini

    environment:
      TZ: Asia/Kolkata
      LASER_TED_SERVER: ${LASER_TED_SERVER}
      LASER_TED_API_KEY: ${LASER_TED_API_KEY}
      LASER_AUTOMATION_SERVER: ${LASER_AUTOMATION_SERVER}

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./ofelia/config.ini:/etc/ofelia/config.ini:ro
      - ./ofelia/scripts/api:/scripts/api:ro

    depends_on:
      - postgres-backup

    networks:
      - infra


networks:
  infra:
    name: infra
    driver: bridge


volumes:
  condutor:
    driver: local
    driver_opts:
      type: cifs
      device: "${CONDUTOR_CIFS_DEVICE}"
      o: "username=${CIFS_USERNAME},password=${CIFS_PASSWORD},vers=3.0"

  database:
      driver: local
      driver_opts:
        type: cifs
        device: "${BACKUP_CIFS_DEVICE}"
        o: "username=${CIFS_USERNAME},password=${CIFS_PASSWORD},vers=3.0"
  
  minio-data:
    driver: local
    driver_opts:
      type: cifs
      device: "${BACKUP_CIFS_DEVICE}/Storage"
      o: "username=${CIFS_USERNAME},password=${CIFS_PASSWORD},vers=3.0"

  indexer:
    driver: local
    driver_opts:
      type: cifs
      device: "${INDEXER_CIFS_DEVICE}"
      o: "username=${CIFS_USERNAME},password=${CIFS_PASSWORD},vers=3.0"

  supply:
    driver: local
    driver_opts:
      type: cifs
      device: "${SUPPLY_CIFS_DEVICE}"
      o: "username=${CIFS_USERNAME},password=${CIFS_PASSWORD},vers=3.0"

  costing:
    driver: local
    driver_opts:
      type: cifs
      device: "${COSTING_CIFS_DEVICE}"
      o: "username=${CIFS_USERNAME},password=${CIFS_PASSWORD},vers=3.0"

  old-files:
    driver: local
    driver_opts:
      type: cifs
      device: "${OLD_FILES_CIFS_DEVICE}"
      o: "username=${CIFS_USERNAME},password=${CIFS_PASSWORD},vers=3.0"
  
  tailscale-state:
