; Starts the stopped postgres-backup container (docker start); its entrypoint runs the backup
[job-run "postgres-backup"]
; Every 3 hours on the hour (00:00, 03:00, ... IST)
schedule = 0 0 */3 * * *
container = postgres-backup
no-overlap = true

; TED sync APIs (docs/ted-scheduler-docs.md), hourly, staggered so each picks up the previous job's output
[job-local "ted-sync-dockets"]
schedule = 0 0 * * * *
command = sh /scripts/api/ted-sync.sh /api/sync-dockets
no-overlap = true

[job-local "ted-sync-costing-smartsheet"]
schedule = 0 5 * * * *
command = sh /scripts/api/ted-sync.sh /api/sync-costing-smartsheet
no-overlap = true

[job-local "ted-sync-bom"]
schedule = 0 10 * * * *
command = sh /scripts/api/ted-sync.sh /api/sync-bom
no-overlap = true

[job-local "ted-sync-to-merged"]
schedule = 0 15 * * * *
command = sh /scripts/api/ted-sync.sh /api/sync-to-merged
no-overlap = true

; Automation API (docs/ted-automation-scheduler.md): TenderTiger + Tender247 results into TenderMerged.
; Same wall-clock time as the old Kestra flow (hh:00 UTC = hh:30 IST).
[job-local "automation-sync-result"]
schedule = 0 30 * * * *
command = sh /scripts/api/automation-sync-result.sh both
no-overlap = true
; Raw Material hourly sync — GMD UPDATION catalogue + stock-phys physical stock.
; Endpoint: app/api/scheduler/gmd-update/route.ts (logic in schedular_function/).
; Schedule every hour at :00 (minute hour day-of-month month day-of-week).
; ofelia uses a 6-field cron: sec min hour dom mon dow.
; job-local runs inside the ofelia container; -T 1800 in the script matches the
; route's `maxDuration`.
; no-overlap stops one slow run from stacking behind the next.
[job-local "raw-material-sync"]
schedule = 0 0 * * * *
command = sh /scripts/api/raw-material-sync.sh
no-overlap = true
; Contract Review hourly sync — CONTRACTS + DUMP sheet, Enquiry fields, RM AVAIL.
; Endpoint: app/api/scheduler/contract-review/route.ts (logic in schedular_function/).
;
; Scheduled at :30 rather than :00. This job is heavier than the Raw Material one
; (two full-column spreadsheet reads plus a large ContractReview rewrite), and
; both jobs take a full-table read lock pattern — offsetting them keeps the two
; from contending for the same database in the same minute.
;
; ofelia uses a 6-field cron: sec min hour dom mon dow.
; job-local runs inside the ofelia container; -T 1800 in the script matches the
; route's `maxDuration`.
; no-overlap stops one slow run from stacking behind the next.
[job-local "contract-review-sync"]
schedule = 0 0 * * * *
command = sh /scripts/api/contract-review-sync.sh
no-overlap = 
; C Batch hourly sync — ITEM MASTER ERP ITEM_STATUS = "C" -> cBatch marks.
; Endpoint: app/api/scheduler/c-batch/route.ts (logic in schedular_function/).
;
; Scheduled at :45, last of the four hourly jobs, so it sees the item codes the
; other three just refreshed. Overlap with another job is safe: this one writes
; only the cBatch column, which no other scheduled job touches.
;
; Set-only — existing marks are never cleared, so re-running is idempotent and a
; bad run cannot destroy data. VerifyBom is deliberately excluded: /bom's cBatch
; comes from the BOM MAST ERP TO_DATE flow.
;
; ofelia uses a 6-field cron: sec min hour dom mon dow.
; job-local runs inside the ofelia container; -T 600 in the script is well inside
; the route's maxDuration.
[job-local "c-batch-sync"]
schedule = 0 45 * * * *
command = sh /scripts/api/c-batch-sync.sh
no-overlap = true



