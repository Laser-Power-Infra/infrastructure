; Starts the stopped postgres-backup container (docker start); its entrypoint runs the backup
[job-run "postgres-backup"]
; Every 3 hours on the hour (00:00, 03:00, ... IST)
schedule = 0 0 */3 * * *
container = postgres-backup
no-overlap = true

; TED sync APIs (docs/ted-scheduler-docs.md), hourly, staggered so each picks up the previous job's output
[job-local "ted-sync-dockets"]
schedule = 0 0 * * * *
command = sh /scripts/api/ted-sync.sh /api/sync-dockets
no-overlap = true

[job-local "ted-sync-costing-smartsheet"]
schedule = 0 5 * * * *
command = sh /scripts/api/ted-sync.sh /api/sync-costing-smartsheet
no-overlap = true

[job-local "ted-sync-bom"]
schedule = 0 10 * * * *
command = sh /scripts/api/ted-sync.sh /api/sync-bom
no-overlap = true

[job-local "ted-sync-to-merged"]
schedule = 0 15 * * * *
command = sh /scripts/api/ted-sync.sh /api/sync-to-merged
no-overlap = true

; Automation API (docs/ted-automation-scheduler.md): TenderTiger + Tender247 results into TenderMerged.
; Same wall-clock time as the old Kestra flow (hh:00 UTC = hh:30 IST).
[job-local "automation-sync-result"]
schedule = 0 30 * * * *
command = sh /scripts/api/automation-sync-result.sh both
no-overlap = true

; Raw Material hourly sync — GMD UPDATION catalogue + stock-phys physical stock.
; Endpoint: app/api/scheduler/gmd-update/route.ts (logic in schedular_function/).
; Schedule every hour at :00 (minute hour day-of-month month day-of-week).
; ofelia uses a 6-field cron: sec min hour dom mon dow.
; job-local runs inside the ofelia container; -T 1800 in the script matches the
; route's `maxDuration`.
; no-overlap stops one slow run from stacking behind the next.
[job-local "raw-material-sync"]
schedule = 0 0 * * * *
command = sh /scripts/api/raw-material-sync.sh
no-overlap = true


; Contract Review hourly sync — CONTRACTS + DUMP sheet, Enquiry fields, RM AVAIL.
; Endpoint: app/api/scheduler/contract-review/route.ts (logic in schedular_function/).
;
; Scheduled at :30 rather than :00. This job is heavier than the Raw Material one
; (two full-column spreadsheet reads plus a large ContractReview rewrite), and
; both jobs take a full-table read lock pattern — offsetting them keeps the two
; from contending for the same database in the same minute.
;
; ofelia uses a 6-field cron: sec min hour dom mon dow.
; job-local runs inside the ofelia container; -T 1800 in the script matches the
; route's `maxDuration`.
; no-overlap stops one slow run from stacking behind the next.
[job-local "contract-review-sync"]
schedule = 0 0 * * * *
command = sh /scripts/api/contract-review-sync.sh
no-overlap = true

; C Batch hourly sync — ITEM MASTER ERP ITEM_STATUS = "C" -> cBatch marks.
; Endpoint: app/api/scheduler/c-batch/route.ts (logic in schedular_function/).
;
; Scheduled at :45, last of the four hourly jobs, so it sees the item codes the
; other three just refreshed. Overlap with another job is safe: this one writes
; only the cBatch column, which no other scheduled job touches.
;
; Set-only — existing marks are never cleared, so re-running is idempotent and a
; bad run cannot destroy data. VerifyBom is deliberately excluded: /bom's cBatch
; comes from the BOM MAST ERP TO_DATE flow.
;
; ofelia uses a 6-field cron: sec min hour dom mon dow.
; job-local runs inside the ofelia container; -T 600 in the script is well inside
; the route's maxDuration.
[job-local "c-batch-sync"]
schedule = 0 45 * * * *
command = sh /scripts/api/c-batch-sync.sh
no-overlap = true



; Pending docket creation — DocketQuotationThread.pendingDocket = true -> Enquiry.
; Endpoint: app/api/scheduler/docket-creation/route.ts (logic in schedular_function/).
;
; Creates a header-only Enquiry with an auto-generated docket number, links the
; mail attachments, generates the snapshot PDF, and stamps the thread with the
; new docket number + clears pendingDocket. Idempotent: a stamped thread leaves
; the pending set, so re-running is a no-op. `pendingDocket` is set upstream by
; the external mail ingestion.
;
; Scheduled at :20, between supply-history (:15) and contract-review (:30), so
; contract-review's same-hour pass can backfill contractNo on the new dockets.
;
; ofelia uses a 6-field cron: sec min hour dom mon dow.
; job-local runs inside the ofelia container; -T 900 in the script is well inside
; the route's maxDuration.
[job-local "docket-creation-sync"]
schedule = 0 20 * * * *
command = sh /scripts/api/docket-creation-sync.sh
no-overlap = true



; Physical Stock cost / BOM ID hourly derivation.
; Endpoint: app/api/scheduler/physical-stock-cost-bom/route.ts (logic in
; schedular_function/run-physical-stock-cost-bom.ts).
;
; Recomputes cost / bom_id by reading the local BOM graph (FullItem / Bom /
; BomItem) and writing the result to the Neon PhysicalStock table.
;
; Scheduled at :10 — after bom-mast (:05), whose BOM graph this step reads, and
; before supply-history (:15). It writes only Neon, so it contends with no other
; job for the local database.
;
; ofelia uses a 6-field cron: sec min hour dom mon dow.
; job-local runs inside the ofelia container; -T 1800 in the script matches the
; route's `maxDuration`.
; no-overlap stops one slow run from stacking behind the next.
[job-local "physical-stock-cost-bom-sync"]
schedule = 0 10 * * * *
command = sh /scripts/api/physical-stock-cost-bom-sync.sh
no-overlap = true
; PBG sheet sync — PBG sheet -> PbgData. Runs every 1.2h (72m).
; Endpoint: app/api/scheduler/pbg/route.ts (logic in schedular_function/).
;
; ofelia's schedule field is Go cron, which accepts `@every <duration>`, so
; `@every 1h12m` is exactly the 72-minute cadence we want (a plain cron cannot
; express "every 72 minutes"). The interval counts from when ofelia starts, not
; wall-clock — fine for this job.
;
; Light and safe to overlap: it writes only PbgData, which no other scheduled
; job touches.
;
; job-local runs inside the ofelia container; -T 600 in the script matches the
; route's `maxDuration`.
[job-local "pbg-sync"]
schedule = @every 1h12m
command = sh /scripts/api/pbg-sync.sh
no-overlap = true

; BOM MAST ERP hourly sync — BOM MAST ERP tab -> FullItem / Bom / BomItem.
; Endpoint: app/api/scheduler/bom-mast/route.ts (logic in schedular_function/).
;
; Scheduled at :05 — after raw-material (:00), whose RawMaterial rows the BOM
; components resolve against, and before supply-history (:15), whose link
; rebuild reads the Bom / BomItem graph this job writes.
;
; ofelia uses a 6-field cron: sec min hour dom mon dow.
; job-local runs inside the ofelia container; -T 1800 in the script matches the
; route's `maxDuration`.
; no-overlap stops one slow run from stacking behind the next.
[job-local "bom-mast-sync"]
schedule = 0 5 * * * *
command = sh /scripts/api/bom-mast-sync.sh
no-overlap = true
